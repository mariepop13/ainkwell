# CodeRabbit Configuration
# Configuration for code analysis and automatic reviews

# General settings
language: "en-CA"
tone_instructions: "Be professional, constructive, and focus on code quality. Provide actionable feedback with clear explanations. Explain the 'why' behind recommendations. Enforce clean code: small functions, clear naming, early returns, single responsibility."
early_access: false
enable_free_tier: true

# Reviews
reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  high_level_summary_instructions: "Create concise release notes as a bullet-point list, highlighting key changes, improvements, and any breaking changes. Include a brief summary of affected areas (frontend, backend, AI, etc.)."
  high_level_summary_placeholder: "@coderabbitai summary"
  high_level_summary_in_walkthrough: false
  auto_title_placeholder: "@coderabbitai"
  auto_title_instructions: "Generate concise titles that follow Gitmoji conventions. Include the type of change (✨ for features, 🐛 for bugs, ♻️ for refactors, etc.) and a brief description of what changed."
  review_status: false
  commit_status: true
  fail_commit_status: false
  collapse_walkthrough: false
  changed_files_summary: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: true
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: true
  auto_assign_reviewers: false
  in_progress_fortune: true
  poem: true
  enable_prompt_for_ai_agents: true
  
  # File filters
  path_filters:
    - "!node_modules/**"
    - "!.next/**"
    - "!.git/**"
    - "!dist/**"
    - "!build/**"
    - "!coverage/**"
    - "!*.lock"
    - "!*.log"
    - "!package-lock.json"
    - "src/**"
  
  # Path-specific instructions
  path_instructions:
    - path: "**/*.ts"
      instructions: "Follow clean code principles: functions should be small (20-40 lines), focused on single responsibility, use early returns for guard clauses, avoid deep nesting (max 2 levels), use clear intention-revealing names, avoid magic numbers (use named constants), prefer pure functions when possible, and handle errors explicitly. Remove commented-out code and unnecessary comments."
    - path: "**/*.tsx"
      instructions: "Follow clean code principles: components should be small and focused, use clear prop names, prefer composition over inheritance, extract complex logic into custom hooks, use early returns for conditional rendering, and keep components under 200-400 lines. Remove commented-out code and unnecessary comments."
    - path: "**/*.test.ts"
      instructions: "Tests should be clear, well-structured with arrange/act/assert pattern, and cover edge cases and errors. Follow clean code: use descriptive test names, keep tests focused on one thing, avoid duplication with proper setup/teardown, and make tests readable."
    - path: "**/*.test.tsx"
      instructions: "React component tests should use Testing Library, test accessibility and user interactions. Follow clean code: use descriptive test names, test user behavior not implementation details, keep tests focused and readable."
    - path: "src/firebase/**"
      instructions: "Firebase code should handle errors properly, validate inputs, and follow Firebase best practices. Pay special attention to authentication state, Firestore permission errors, and proper cleanup of subscriptions. Follow clean code: small focused functions, clear naming, early returns, guard against null values, and explicit error handling. Use proper TypeScript types for Firebase objects."
    - path: "src/firebase/auth/**"
      instructions: "Authentication hooks and utilities should handle loading states, error states, and auth state changes properly. Guards should be in place for null auth instances. Follow clean code: single responsibility, proper cleanup on unmount, and clear state management."
    - path: "src/firebase/firestore/**"
      instructions: "Firestore hooks should handle permission errors specifically (permission-denied code), preserve original errors, and provide proper cleanup. Use proper memoization for query references. Follow clean code: guard against null references, explicit error handling with proper error codes, and lifecycle management."
    - path: "src/components/**"
      instructions: "React components should be reusable, accessible, follow ARIA guidelines, and use proper TypeScript types for props. Prefer composition over inheritance. Follow clean code: small focused components, extract complex logic, use early returns, and keep components under 400 lines."
    - path: "src/hooks/**"
      instructions: "Custom hooks should be well-typed, handle error states, be testable, and follow the rules of hooks. Return values should be properly typed. Follow clean code: single responsibility, small focused hooks, clear naming, and explicit error handling."
    - path: "src/context/**"
      instructions: "Context providers should handle loading and error states properly, and provide clear TypeScript types for the context value. Follow clean code: small focused providers, clear state management, and explicit error handling."
    - path: "src/lib/**"
      instructions: "Utility functions should be pure when possible, well-typed. Handle edge cases and validate inputs. Follow clean code: small focused functions (20-40 lines), single responsibility, early returns, clear naming, avoid magic numbers, and prefer immutability."
  
  abort_on_close: true
  disable_cache: false
  
  # Auto review
  auto_review:
    enabled: true
    auto_incremental_review: false
    ignore_title_keywords:
      - "wip"
      - "draft"
      - "do not review"
    labels: []
    drafts: false
    base_branches:
      - "develop"
      - "main"
    ignore_usernames: []
  
  # Finishing touches
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: true
  
  # Pre-merge checks
  pre_merge_checks:
    title:
      mode: "warning"
      requirements: "Title should be concise and descriptive, ideally under 50 characters, and follow Gitmoji conventions."
    description:
      mode: "off"
    issue_assessment:
      mode: "warning"
    custom_checks:
      - name: "TypeScript Strict Mode"
        mode: "warning"
        instructions: "Ensure all TypeScript code follows strict mode rules. Check for any 'any' types, implicit any, and proper type coverage."
      - name: "Error Handling"
        mode: "warning"
        instructions: "Verify that error handling is implemented for async operations, API calls, and user interactions. Errors should be caught and handled appropriately."
      - name: "Accessibility"
        mode: "warning"
        instructions: "Check that UI components include proper ARIA labels, keyboard navigation support, and semantic HTML. Forms should have proper labels and error messages."
      - name: "Clean Code Principles"
        mode: "warning"
        instructions: "Verify code follows clean code principles: functions/methods should be small (20-40 lines), focused on single responsibility, use early returns for guard clauses, avoid deep nesting (max 2 levels), use clear intention-revealing names, avoid magic numbers (use named constants), prefer pure functions when possible, handle errors explicitly, remove commented-out code, and keep files under 400 lines (consider splitting if larger). Functions should have ≤3-4 parameters (group into objects if more)."
  
  # Tools
  tools:
    eslint:
      enabled: true
    biome:
      enabled: true
    markdownlint:
      enabled: true
    gitleaks:
      enabled: true
    github-checks:
      enabled: true
      timeout_ms: 90000
    languagetool:
      enabled: true
      level: "default"
    yamllint:
      enabled: true
    actionlint:
      enabled: true
    oxc:
      enabled: true

# Chat
chat:
  art: true
  auto_reply: true
  integrations:
    jira:
      usage: "auto"
    linear:
      usage: "auto"

# Knowledge base
knowledge_base:
  opt_out: false
  web_search:
    enabled: true
  code_guidelines:
    enabled: true
    filePatterns:
      - "**/.cursorrules"
      - "**/.cursor/rules/*"
      - "**/.windsurfrules"
      - "**/.clinerules/*"
      - "**/.rules/*"
      - "**/AGENT.md"
      - "**/AGENTS.md"
      - "README.md"
      - "docs/**/*.md"
  learnings:
    scope: "auto"
  issues:
    scope: "auto"
  jira:
    usage: "auto"
    project_keys: []
  linear:
    usage: "auto"
    team_keys: []
  pull_requests:
    scope: "auto"
  mcp:
    usage: "auto"
    disabled_servers: []

# Code generation
code_generation:
  unit_tests:
    path_instructions:
      - path: "src/**/*.ts"
        instructions: "Tests should cover the happy path, edge cases, and errors. Use descriptive test names. Follow clean code: arrange/act/assert pattern, one assertion per test concept, clear test names that describe what is being tested."
      - path: "src/**/*.tsx"
        instructions: "Component tests should use Testing Library, test rendering, interactions, and accessibility. Follow clean code: test user behavior not implementation, use descriptive test names, keep tests focused and readable."
      - path: "src/firebase/**/*.test.ts"
        instructions: "Firebase tests should mock Firebase SDKs properly using Vitest, test error handling (especially permission-denied), loading states, cleanup on unmount, and auth state changes. Use FirebaseProvider wrapper for hooks that require context. Follow clean code: clear test names, proper setup/teardown, and test one concept per test."
      - path: "src/firebase/**/*.test.tsx"
        instructions: "Firebase hook tests should use renderHook from Testing Library with proper FirebaseProvider wrappers. Test loading states, error states, data updates, and cleanup. Mock Firebase functions properly and test error codes specifically. Follow clean code: descriptive test names, arrange/act/assert pattern, and isolate test scenarios."

